<!DOCTYPE html>
<html>
<style>
  body { background: #fff; padding: 50px; display: flex; gap: 20px; }
  .icon-box {
    width: 72px; height: 72px; border-radius: 16px; object-fit: cover;
    box-shadow: 0px 4px 8px 0px #d1d9e4;
  }
  .icon-drop {
    width: 72px; height: 72px; object-fit: cover;
    filter: drop-shadow(0px 4px 8px #d1d9e4);
  }
  .icon-active-box {
    width: 72px; height: 72px; border-radius: 20px; object-fit: cover;
    border: 2px solid #1f2937; padding: 4px;
    box-shadow: 0px 4px 8px 0px #d1d9e4;
  }
</style>
<body>
  <img src="images/steam.png" class="icon-box">
  <img src="images/steam.png" class="icon-drop">
  <img src="images/pubg.png" class="icon-active-box">
</body>
</html>
